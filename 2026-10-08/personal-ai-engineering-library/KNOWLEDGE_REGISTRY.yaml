- knowledge_id: K-SOFTWARE-SHOPIFY
  title: Storefront API (public read-only)
  domain: Software
  subdomain: General
  type: API / Specification
  summary: 'Different endpoint, different token, used for customer-facing apps/hydrogen-style headless setups. Headers differ:'
  content: 01_KNOWLEDGE/Software/K-SOFTWARE-SHOPIFY.md
  keywords:
  - only
  - public
  - read
  - shopify
  - storefront
  - General
  concepts:
  - Endpoint:** `https://$SHOPIFY_STORE_DOMAIN/api/$SHOPIFY_API_VERSION/graphql.json`
  - 'Auth header (public):** `X-Shopify-Storefront-Access-Token: <public token>` — embeddable in browser'
