- knowledge_id: K-AI-PROMPT-AUDIT
  title: 维度 H：规则去重（硬门禁）
  domain: AI
  subdomain: AI
  type: Constraint
  summary: 目的：** 确保 prompt 里同一语义只出现一次，没有从多源（writing-style / anti-ai / scene-craft / genre-example）带进来的重复规则。这是"组装后去重检查"（prompt-crafting.md
    Step 2）的核验——组装流程要求了，但需要独立视角确认做到了没有。
  content: 01_KNOWLEDGE/AI/K-AI-PROMPT-AUDIT.md
  keywords:
  - audit
  - prompt
  - AI
  concepts:
  - 目的：** 确保 prompt 里同一语义只出现一次，没有从多源（writing-style / anti-ai / scene-craft / genre-example）带进来的重复规则。这是"组装后去重检查"（prompt-crafting.md
    Step 2）的核验——组装流程要求了，但需要
  - 任一重复 → **FAIL**（打回时指出哪两条是同一件事，建议合并哪条）
  - 全部唯一 → **PASS**
  - 操作判据（硬门禁必须可判定）：**
  - 措辞不同的等价约束**："对话要短"+"纯台词不超8句"+"少让角色长篇"指向同一件事但各有侧重（一个给原则、一个给数量、一个给反例）→ 是有效冗余，保留。审计只要求**同一格式的完全重复**被合并，不要求所有语义等价约束合并成一条。
