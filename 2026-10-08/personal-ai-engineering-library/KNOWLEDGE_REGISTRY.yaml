- knowledge_id: K-AI-NOVEL-DISPATCH-002
  title: 作者确认关卡（人铸灵魂，AI 行笔墨）
  domain: AI
  subdomain: AI
  type: Constraint
  summary: 设定、卷纲、章纲是故事的灵魂，AI 只负责笔墨。以下产出 order DONE 后**必须停下等作者确认**，未确认前不写下一步 order、不推进 step（与 setup 的确认语义同构）：
  content: 01_KNOWLEDGE/AI/K-AI-NOVEL-DISPATCH-002.md
  keywords:
  - dispatch
  - novel
  - AI
  concepts:
  - 作者明确确认（"可以/没问题/就这样"）→ 推进；作者要改 → 重派对应 agent（order 内嵌修改意见）→ 改完再次展示确认（受重试/断路器约束）
  - 作者回复模糊（"差不多""你看着办"）→ 一律视为未确认，追问具体哪项不确定
  - 作者说"你全权写/别等确认"（全自动模式）→ 展示摘要后视为已确认直接推进；**单次有效**，下一关卡仍停（作者再说一次即再放行）
  - 作者说"继续/推进"= 推进到下一个作者确认关卡即停**，不是推到底；正文流水线（提示词→正文→去AI味→验收→归档）属 AI 笔墨，确认章纲后可连续推进到归档后的重写/下一章询问
