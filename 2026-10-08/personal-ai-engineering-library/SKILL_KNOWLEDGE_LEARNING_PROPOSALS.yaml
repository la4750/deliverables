  observation: 域分类启发式将题材禁用词表中的 'PCB/电路/芯片' 误判为 Electronics 信号
  current_rule: ELE/ROB/AI hint ≥2 即可覆盖技能域
  new_observation: 词表/枚举类内容会包含跨域关键词，命中≠内容属于该域
  proposed_change: hint 覆盖须结合技能域与内容上下文（如仅在技能域匹配或命中词处于技术语境）时生效
  confidence: high
  evidence: 2 个单元被人工裁决 DOMAIN_MISCLASSIFIED；原文为修仙题材禁用词表
  impact: 减少入库后域纠错
  requires_human_review: true
  status: PROPOSED
- proposal_id: LP-002
