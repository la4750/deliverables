  current_rule: 人工裁决分类 PROJECT_EXPERIENCE
  new_observation: schema 无对应 type，本轮以 curation+project_experience 子结构承载
  proposed_change: 类型枚举增加 Project Experience，或为 unit 增加 observation_date/revalidation_required 标准字段
