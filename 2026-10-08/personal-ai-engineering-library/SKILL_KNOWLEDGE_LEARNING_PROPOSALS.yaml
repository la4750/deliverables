  - K-AI-STYLE-DISTILL
  observation: Workflow 中发现可跨项目复用的抽象原则：幂等 checkpoint/resume、受托工作自述必须独立复核、统计样本量下限
  current_rule: Workflow 不得转 Knowledge；无'从流程中抽象原则'的通道
  new_observation: 流程绑定的单元内可能含抽象后可复用的通用工程原则
  proposed_change: 允许以'抽象评审'方式从 Workflow 提取通用原则为 Knowledge Candidate（不搬运流程本身）
  confidence: medium
